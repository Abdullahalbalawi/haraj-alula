<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#33200f">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>حراج العلا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"></noscript>
<style id="css-base">
:root{
  --ink:#1f120a; --bark:#33200f; --umber:#4d311c; --clay:#99683a;
  --gold:#e6bd74; --gold-deep:#b27f36; --sand:#ead3ab; --cream:#f8eedc;
  --ember:#b0501a; --palm:#5d6a37;
  --on-dark:#f7ead3; --on-dark-muted:#d6bf9e;
  --on-light:#2a190e; --on-light-muted:#6a513a;
  --line-dark:rgba(246,226,190,.18); --line-light:rgba(74,46,27,.14);
  --pad:1rem;
  --font:"Tajawal",system-ui,"Segoe UI",Tahoma,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --ink:#1f120a; --bark:#33200f; } }
:root[data-theme="dark"]{ --ink:#1f120a; --bark:#33200f; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;font-size:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
@media (max-width:379px){html{font-size:93.75%} :root{--pad:.8rem}}
@media (max-width:339px){html{font-size:87.5%} :root{--pad:.7rem}}
/* الشاشات الكبيرة جدًا: تكبير متناسب حتى لا يبدو المحتوى صغيرًا */
@media (min-width:1800px) and (min-height:900px){html{font-size:112.5%}}
@media (min-width:2400px) and (min-height:1200px){html{font-size:131.25%}}
body{height:100%;margin:0;background:var(--ink);color:var(--on-dark);font-family:var(--font);font-size:.9375rem;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
/* 16px في الحقول يمنع تكبير آيفون التلقائي عند الكتابة */
input,select,textarea{font-size:16px;font-size:max(16px,1rem)}
button{cursor:pointer;border:0;background:none;padding:0}
img{max-width:100%;display:block}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ic{width:1.375rem;height:1.375rem;flex:none}

/* ---------- shell ---------- */
.app{position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.app-bg{position:absolute;top:0;right:0;bottom:0;left:0;background-color:#2e1b0e;
  background-image:
    radial-gradient(ellipse 85% 46% at 88% 0%,rgba(224,172,92,.30),rgba(224,172,92,0) 72%),
    radial-gradient(ellipse 70% 40% at 0% 100%,rgba(93,106,55,.16),rgba(93,106,55,0) 70%),
    repeating-linear-gradient(174deg,rgba(246,226,190,.04) 0,rgba(246,226,190,.04) 2px,rgba(246,226,190,0) 2px,rgba(246,226,190,0) 54px),
    linear-gradient(180deg,#54331b 0%,#39220f 34%,#25160b 70%,#1c1008 100%)}
.main{position:relative;order:1;flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.page,.foot-in{width:100%;max-width:70rem;margin:0 auto}
.page-add{max-width:40rem}
.page-login{max-width:30rem}
.page-myads,.page-notifs{max-width:46rem}
.page-chats,.page-thread,.page-account,.foot-thread{max-width:46rem}
.page-splash{max-width:none;height:100%}

/* ---------- shared controls ---------- */
.round-btn{width:2.625rem;height:2.625rem;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;
  background:rgba(246,226,190,.12);border:1px solid var(--line-dark);color:var(--on-dark)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:3.25rem;padding:0 1.1rem;border-radius:999px;font-weight:700;font-size:1.0625rem}
.btn .ic{margin-left:.5rem}
.btn-gold{color:#2a190e;background:#d6a557;background:linear-gradient(180deg,#f6dca6 0%,#d6a557 55%,#a8742f 100%);
  box-shadow:0 8px 22px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.55)}
.btn-ghost{color:var(--on-dark);border:1px solid rgba(246,226,190,.5);background:rgba(20,11,6,.35)}
.topbar{display:flex;align-items:center;padding:.9rem var(--pad) .6rem}
.topbar h1{flex:1;text-align:center;font-size:1.25rem;font-weight:700;margin:0 .75rem;min-width:0}
.topbar .ghost{width:2.625rem;flex:none}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;padding:1.4rem var(--pad) .6rem}
.sec-head h2{font-size:1.125rem;font-weight:700;text-shadow:0 1px 6px rgba(31,18,10,.7)}
.sec-head button{font-size:.875rem;color:var(--gold);display:flex;align-items:center}
.sec-head .ic{width:1rem;height:1rem;margin-right:.1rem}

/* ---------- logo ---------- */
.logo{display:inline-flex;align-items:center;color:var(--gold);text-align:right}
.logo svg{width:2.75rem;height:2.375rem;margin-left:.6rem;flex:none}
.logo b{display:block;font-size:1.375rem;font-weight:800;line-height:1.15;color:var(--on-dark)}

/* ---------- splash ---------- */
.splash{position:relative;min-height:100%;display:flex;background-color:#3a2210;
  background-image:radial-gradient(ellipse 95% 40% at 50% 12%,rgba(240,200,130,.40),rgba(240,200,130,0) 70%),linear-gradient(180deg,#7c4b23 0%,#56331a 36%,#2d1a0d 76%,#1f120a 100%)}
.has-pat .splash{background-image:var(--pat),radial-gradient(ellipse 95% 40% at 50% 12%,rgba(240,200,130,.40),rgba(240,200,130,0) 70%),linear-gradient(180deg,#7c4b23 0%,#56331a 36%,#2d1a0d 76%,#1f120a 100%)}
.splash::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(180deg,rgba(31,18,10,0) 50%,rgba(31,18,10,.55) 100%)}
.splash-in{position:relative;width:100%;max-width:30rem;margin:0 auto;display:flex;flex-direction:column;padding-bottom:1.5rem}
.sp-main{text-align:center;padding:2rem 1.4rem 0;color:var(--on-dark)}
.sp-main>svg{width:5.25rem;height:4.5rem;color:var(--gold)}
.sp-main h1{font-size:3.25rem;font-weight:800;line-height:1.15;margin-top:.3rem;color:#f6dca6;-webkit-filter:drop-shadow(0 3px 10px rgba(31,18,10,.6));filter:drop-shadow(0 3px 10px rgba(31,18,10,.6))}
@supports ((-webkit-background-clip:text) or (background-clip:text)){.sp-main h1{background:linear-gradient(180deg,#fff6e2 10%,#f0cd8c 55%,#c9944a 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}}
.sp-main .tag{font-size:1.125rem;margin-top:.4rem;font-weight:500}
.sp-main .search{margin:1.1rem 0 0}
.sp-main .search button{flex:none;width:2.5rem;height:2.5rem;margin-left:-.6rem;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#2a190e;background:#d6a557;background:linear-gradient(180deg,#f6dca6,#d6a557)}
.sp-main .search button .ic{color:#2a190e;-webkit-transform:scaleX(-1);transform:scaleX(-1)}
.sp-stats{display:flex;justify-content:center;flex-wrap:wrap;margin-top:.9rem;font-size:.8125rem;color:var(--on-dark-muted)}
.sp-stats span{display:inline-flex;align-items:baseline;margin:0 .55rem}
.sp-stats b{color:var(--gold);font-size:1.0625rem;font-weight:800;margin-left:.3rem}
.sp-cta{margin-top:1rem}
.sp-cta .btn + .btn{margin-top:.6rem}
.sp-note{font-size:.8125rem;color:var(--on-dark-muted);margin-top:.6rem}
.sp-login{display:inline-block;margin-top:.5rem;padding:.25rem .5rem;font-size:.9375rem;color:var(--on-dark-muted)}
.sp-login b{color:var(--gold);text-decoration:underline}
.sp-side{min-width:0;padding-top:1.25rem}
.splash-cats{display:grid;grid-template-columns:repeat(4,1fr);grid-gap:.5rem;gap:.5rem;padding:0 1.4rem}
.splash-cats button{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.7rem .15rem .55rem;border-radius:16px;font-size:.75rem;font-weight:500;text-align:center;line-height:1.25;
  color:var(--on-dark);background:rgba(246,226,190,.10);border:1px solid var(--line-dark)}
.splash-cats .ic{width:1.6rem;height:1.6rem;color:var(--gold);margin-bottom:.35rem}
.splash .sec-head{padding:1.2rem 1.4rem .6rem}
.splash .hscroll{display:flex;overflow-x:auto;padding:0 1.4rem .4rem;scroll-snap-type:x mandatory;scroll-padding-inline:1.4rem;clip-path:inset(0 1.4rem)}
.splash .hscroll .card{flex:0 0 100%;scroll-snap-align:start}
.splash .hscroll .card.card + .card{margin-right:.75rem}
.splash .hscroll::after{display:block;content:"";flex:0 0 1.4rem}
.perks{display:flex;margin:1.25rem 1.4rem 0;padding:.9rem .5rem;border-radius:20px;color:var(--on-dark);
  background:rgba(44,26,14,.66);border:1px solid var(--line-dark)}
.perks div{flex:1;display:flex;flex-direction:column;align-items:center;font-size:.875rem;font-weight:500;text-align:center}
.perks .ic{width:1.875rem;height:1.875rem;color:var(--gold);margin-bottom:.35rem}
.splash-foot{text-align:center;color:var(--on-dark-muted);font-size:.875rem;margin-top:1rem}
@media (min-width:900px){
  .splash{align-items:center}
  .splash-in{max-width:68rem;flex-direction:row;align-items:center;padding:2rem 1.5rem}
  .sp-main{flex:0 0 42%;max-width:42%;padding-top:0}
  .sp-side{flex:1;padding-top:0;margin-right:1.5rem}
  .splash .hscroll{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-gap:.75rem;gap:.75rem;overflow:visible;padding-bottom:0;scroll-snap-type:none;clip-path:none}
  .splash .hscroll .card.card + .card{margin-right:0}
  .splash .hscroll .card:nth-child(n+4){display:none}
  .splash .hscroll::after{display:none}
}
@media (prefers-reduced-motion:no-preference){
  @keyframes rise{from{opacity:0;-webkit-transform:translateY(14px);transform:translateY(14px)}to{opacity:1;-webkit-transform:none;transform:none}}
  .sp-main>*,.sp-side{-webkit-animation:rise .5s ease-out both;animation:rise .5s ease-out both}
  .sp-main>*:nth-child(2){animation-delay:.06s}.sp-main>*:nth-child(3){animation-delay:.12s}.sp-main>*:nth-child(4){animation-delay:.2s}
  .sp-main>*:nth-child(5){animation-delay:.28s}.sp-main>*:nth-child(6){animation-delay:.36s}.sp-main>*:nth-child(n+7){animation-delay:.42s}
  .sp-side{animation-delay:.5s}
}

/* ---------- home ---------- */
.home-head{display:flex;align-items:center;justify-content:space-between;padding:.9rem var(--pad) .4rem}
.loc-chip{display:inline-flex;align-items:center;font-size:.8125rem;color:var(--on-dark-muted)}
.loc-chip .ic{width:.875rem;height:.875rem;color:var(--gold);margin-left:.25rem}
.bell{position:relative}
.bell.has::after{content:"";position:absolute;top:.5rem;left:.6rem;width:9px;height:9px;border-radius:50%;background:#e2552b;border:2px solid #4a2e19}
.search{display:flex;align-items:center;margin:.6rem var(--pad) 0;padding:0 1rem;height:3.25rem;border-radius:999px;
  background:var(--cream);color:var(--on-light);box-shadow:0 6px 18px rgba(0,0,0,.3)}
.search input{flex:1;min-width:0;border:0;background:none;outline:0;color:var(--on-light);margin-right:.6rem}
.search input::placeholder{color:var(--on-light-muted)}
.search .ic{color:var(--umber)}
.hero{position:relative;margin:.9rem var(--pad) 0;height:11rem;border-radius:22px;overflow:hidden;border:1px solid rgba(246,226,190,.3);background-color:#a8672b;background-image:linear-gradient(115deg,#dca852 0%,#b5712e 42%,#6c3b18 100%)}
.has-pat .hero{background-image:var(--pat-hero),linear-gradient(115deg,#dca852 0%,#b5712e 42%,#6c3b18 100%)}
.hero::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(0deg,rgba(26,14,7,.62) 0%,rgba(26,14,7,0) 75%)}
.hero-text{position:absolute;z-index:1;right:1.1rem;left:1.1rem;bottom:1rem}
.hero-text h2{font-size:1.625rem;font-weight:800;line-height:1.2}
.hero-text p{font-size:.9375rem;color:#fbeed4}
.hero-cta{display:inline-flex;align-items:center;margin-top:.6rem;padding:.4rem 1rem;border-radius:999px;font-size:.875rem;font-weight:700;color:#2a190e;background:#f8eedc;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.hero-cta .ic{width:1rem;height:1rem;margin-left:.35rem}

.cats{display:grid;grid-template-columns:repeat(4,1fr);grid-gap:.6rem;gap:.6rem;padding:0 var(--pad)}
.cat{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:5.75rem;padding:.7rem .2rem .6rem;
  border-radius:18px;color:var(--on-light);font-size:.8125rem;font-weight:500;line-height:1.25;text-align:center;
  background:#ecd6ae;background:linear-gradient(160deg,#fbf1df 0%,#e3c595 100%);box-shadow:0 6px 14px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.7)}
.cat .ic{width:1.875rem;height:1.875rem;color:#3a2210;margin-bottom:.45rem}

/* ---------- photo slot (نسبة 4:3 ببديل padding للمتصفحات الأقدم) ---------- */
.ph{position:relative}
.photo{position:relative;height:0;padding-top:75%;overflow:hidden;background:#d9bd8f;
  background-image:repeating-linear-gradient(135deg,rgba(74,46,27,.07) 0,rgba(74,46,27,.07) 10px,transparent 10px,transparent 20px)}
.photo img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.photo .slot{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:rgba(74,46,27,.88);font-size:.75rem}
.photo .slot .ic{width:1.6rem;height:1.6rem;margin-bottom:.2rem}
.fav{position:absolute;top:.5rem;left:.5rem;width:2.125rem;height:2.125rem;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(248,238,220,.92);color:var(--umber);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.fav .ic{width:1.125rem;height:1.125rem}
.fav[aria-pressed="true"]{color:#c0361c}
.fav[aria-pressed="true"] .ic{fill:currentColor}
.badge{position:absolute;top:.5rem;right:.5rem;padding:.1rem .6rem;border-radius:999px;font-size:.75rem;font-weight:700;
  color:#2a190e;background:#e6bd74;background:linear-gradient(180deg,#f6dca6,#d6a557)}

/* ---------- ad cards ---------- */
.card{display:flex;flex-direction:column;text-align:right;border-radius:18px;overflow:hidden;color:var(--on-light);cursor:pointer;
  background:#f3e4c9;background:linear-gradient(180deg,#fbf2e2,#eedcbc);box-shadow:0 8px 18px rgba(0,0,0,.3)}
.card-body{flex:1;padding:.6rem .75rem .75rem}
.card h3{font-size:.9375rem;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.price{font-size:1.125rem;font-weight:800;color:var(--ember);line-height:1.3;margin-top:.1rem}
.price small{font-size:.75rem;font-weight:500;color:var(--on-light-muted)}
.meta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:.35rem;font-size:.75rem;color:var(--on-light-muted)}
.meta span{display:inline-flex;align-items:center;white-space:nowrap}
.meta .ic{width:.8125rem;height:.8125rem;margin-left:.2rem}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-gap:.75rem;gap:.75rem;padding:0 var(--pad)}
.hscroll{display:flex;overflow-x:auto;padding:0 var(--pad) .4rem;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory;scroll-padding-inline:var(--pad)}
.page-home .hscroll{clip-path:inset(0 var(--pad))}
.hscroll::-webkit-scrollbar{display:none}
.hscroll .card{flex:0 0 100%;scroll-snap-align:start}
.hscroll .card + .card{margin-right:.75rem}
.hscroll::after{content:"";flex:0 0 var(--pad)}
.list{display:grid;grid-template-columns:minmax(0,1fr);grid-gap:.75rem;gap:.75rem;padding:0 var(--pad)}
.card.row{flex-direction:row}
.card.row .ph{flex:0 0 36%;max-width:9rem}
.card.row .photo{height:100%;min-height:7rem;padding-top:0}
.card.row .card-body{display:flex;flex-direction:column;justify-content:center;padding-left:2.6rem;position:relative;min-width:0}
.card.row h3{min-height:0}
.card.row .fav{top:.5rem;left:.3rem;background:none;box-shadow:none}

/* ---------- listing filters ---------- */
.filters{display:flex;padding:.75rem var(--pad) .25rem}
.pill{flex:1;min-width:0;display:flex;align-items:center;height:2.75rem;padding:0 .8rem;border-radius:999px;
  background:rgba(246,226,190,.12);border:1px solid var(--line-dark)}
.pill + .pill{margin-right:.5rem}
.pill .ic{width:1.125rem;height:1.125rem;color:var(--gold);margin-left:.5rem}
.pill select{-webkit-appearance:none;-moz-appearance:none;appearance:none;flex:1;min-width:0;border:0;background:none;outline:0;color:var(--on-dark)}
.pill select option{color:#2a190e}
.chips{display:flex;overflow-x:auto;padding:.6rem var(--pad) .9rem;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:.35rem .9rem;border-radius:999px;font-size:.875rem;border:1px solid var(--line-dark);color:var(--on-dark);background:rgba(31,18,10,.35)}
.chip + .chip{margin-right:.5rem}
.chip[aria-pressed="true"]{background:var(--gold);color:#2a190e;border-color:var(--gold);font-weight:700}
.cat-label{display:flex;align-items:center;font-weight:700;color:var(--gold);padding:0 var(--pad)}
.cat-label .ic{margin-left:.5rem}
.count{padding:0 var(--pad) .6rem;font-size:.8125rem;color:var(--on-dark-muted)}
.empty{margin:1.8rem var(--pad);padding:1.75rem 1.25rem;text-align:center;border-radius:18px;border:1px dashed var(--line-dark);color:var(--on-dark-muted)}
.empty b{display:block;color:var(--on-dark);font-size:1.0625rem;margin-bottom:.25rem}

/* ---------- detail ---------- */
.gallery{position:relative;overflow:hidden}
.gallery .track{display:flex;overflow-x:auto;-webkit-scroll-snap-type:x mandatory;scroll-snap-type:x mandatory;scrollbar-width:none}
.gallery .track::-webkit-scrollbar{display:none}
.gallery .slide{flex:0 0 100%;scroll-snap-align:center}
.gallery .bar{position:absolute;top:.75rem;right:.9rem;left:.9rem;display:flex}
.gallery .bar .round-btn{background:rgba(31,18,10,.6);border-color:rgba(246,226,190,.3)}
.gallery .bar .round-btn + .round-btn{margin-right:.5rem}
.gallery .bar .round-btn[aria-pressed="true"]{color:#ff8d6b}
.gallery .bar .round-btn[aria-pressed="true"] .ic{fill:currentColor}
.gallery .bar .sp{flex:1}
.gallery .counter{position:absolute;bottom:.75rem;right:.9rem;padding:.1rem .75rem;border-radius:999px;font-size:.8125rem;background:rgba(31,18,10,.7)}
.sheet{padding:1.1rem var(--pad) .5rem}
.sheet h1{font-size:1.375rem;font-weight:800;line-height:1.3}
.sheet .price{font-size:1.625rem;color:var(--gold)}
.sheet .price small{color:var(--on-dark-muted);font-size:.875rem}
.facts{display:flex;flex-wrap:wrap;margin-top:.5rem;font-size:.875rem;color:var(--on-dark-muted)}
.facts span{display:inline-flex;align-items:center;margin:0 0 .35rem 1rem}
.facts .ic{width:1rem;height:1rem;color:var(--gold);margin-left:.3rem}
.block{margin:.9rem var(--pad) 0;padding:1rem;border-radius:18px;background:rgba(31,18,10,.5);border:1px solid var(--line-dark)}
.block h2{font-size:1rem;font-weight:700;margin-bottom:.5rem}
.block p{color:#ecdcc0;max-width:60ch}
.specs{display:flex;flex-wrap:wrap;margin:0 -.5rem}
.specs div{flex:1 1 9.5rem;display:flex;justify-content:space-between;margin:0 .5rem;padding:.5rem 0;border-bottom:1px solid var(--line-dark);font-size:.875rem}
.specs dt{color:var(--on-dark-muted);margin-left:.5rem} .specs dd{margin:0;font-weight:700}
.seller{display:flex;align-items:center}
.avatar{width:3.25rem;height:3.25rem;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;font-weight:800;font-size:1.25rem;color:#2a190e;
  background:#d6a557;background:linear-gradient(160deg,#f6dca6,#c9954a);margin-left:.75rem}
.seller b{display:flex;align-items:center;font-size:1rem}
.seller b .ic{width:1.0625rem;height:1.0625rem;color:var(--gold);margin-right:.3rem}
.seller small{display:flex;flex-wrap:wrap;color:var(--on-dark-muted);font-size:.8125rem}
.seller small span{display:inline-flex;align-items:center;margin-left:.75rem}
.seller small .ic{width:.875rem;height:.875rem;margin-left:.25rem}
.star .ic{color:var(--gold);fill:var(--gold)}
.actions{display:flex;padding:.75rem var(--pad) .9rem}
.actions .btn{min-height:3.1rem}
.actions .btn + .btn{margin-right:.6rem}
.foot-detail{background:rgba(31,18,10,.82)}

/* ---------- wizard ---------- */
.steps{padding:.25rem var(--pad) .9rem}
.steps .now{display:flex;justify-content:space-between;align-items:baseline;font-size:.875rem;color:var(--on-dark-muted);margin-bottom:.5rem}
.steps .now b{font-size:1.0625rem;color:var(--on-dark)}
.steps ol{list-style:none;display:flex;margin:0 -2px;padding:0}
.steps li{flex:1;height:6px;margin:0 2px;border-radius:3px;background:rgba(246,226,190,.18)}
.steps li.past{background:var(--gold-deep)} .steps li.cur{background:var(--gold)}
.form{margin:0 var(--pad);padding:1.1rem 1rem;border-radius:22px;color:var(--on-light);
  background:#f3e4c9;background:linear-gradient(180deg,#fbf2e2,#efddbe);box-shadow:0 10px 24px rgba(0,0,0,.3)}
.form h2{font-size:1.1875rem;font-weight:800}
.form .hint{color:var(--on-light-muted);font-size:.875rem;margin:.1rem 0 .9rem}
.field{display:block;margin-top:.75rem}
.field>span{display:block;font-size:.875rem;font-weight:700;margin-bottom:.4rem}
.field input,.field textarea,.field select{width:100%;min-height:3rem;padding:.6rem .9rem;border-radius:14px;border:1px solid rgba(74,46,27,.25);background:#fffaf0;color:var(--on-light);outline:0}
.field textarea{min-height:8rem;resize:vertical;line-height:1.6}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--gold-deep);box-shadow:0 0 0 3px rgba(178,127,54,.25)}
.check{display:flex;align-items:center;margin-top:.9rem;font-size:.9375rem}
.check input{width:1.25rem;height:1.25rem;accent-color:#8a5a25;margin-left:.6rem}
.err{margin-top:.75rem;padding:.6rem .75rem;border-radius:12px;background:#f4d3c2;color:#7a2410;font-size:.875rem;font-weight:500}
.form .cats{padding:0;grid-template-columns:repeat(3,1fr)}
.form .cat{background:#fffaf0;box-shadow:none;border:1px solid rgba(74,46,27,.2);min-height:5.25rem}
.form .cat[aria-pressed="true"]{background:#e6bd74;background:linear-gradient(180deg,#f6dca6,#dcae63);border-color:#8a5a25}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);grid-gap:.5rem;gap:.5rem}
.thumbs .t{position:relative;height:0;padding-top:100%;border-radius:12px;overflow:hidden;background:#e3c595}
.thumbs img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.thumbs .rm{position:absolute;top:.25rem;left:.25rem;width:1.6rem;height:1.6rem;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(31,18,10,.75);color:#fff}
.thumbs .rm .ic{width:.875rem;height:.875rem}
.thumbs .t.new{background:none;border:1.5px dashed #8a5a25}
.thumbs label{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#6a441e;font-size:.75rem;cursor:pointer}
.thumbs .t.new:focus-within{outline:2px solid var(--gold-deep);outline-offset:2px}
.thumbs input{position:absolute;opacity:0;width:1px;height:1px}
.preview{max-width:13.75rem;margin:0 auto;cursor:default}
.summary{margin:.9rem 0 0}
.summary div{display:flex;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid var(--line-light);font-size:.875rem}
.summary dt{color:var(--on-light-muted);margin-left:.75rem;flex:none} .summary dd{margin:0;font-weight:700;text-align:left}
.wiz-nav{display:flex;padding:1rem var(--pad)}
.wiz-nav .btn{min-height:3.1rem}
.wiz-nav .back{flex:0 0 36%;margin-left:.6rem}
.published{text-align:center;padding:.6rem 0}
.published .tick{width:4.5rem;height:4.5rem;margin:.4rem auto .75rem;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:var(--palm)}
.published .tick .ic{width:2.25rem;height:2.25rem}

/* ---------- chats ---------- */
.rowlist{margin:0 var(--pad);border-radius:18px;overflow:hidden;background:rgba(31,18,10,.5);border:1px solid var(--line-dark)}
.rowlist>button{display:flex;align-items:center;width:100%;padding:.875rem;text-align:right;border-bottom:1px solid var(--line-dark)}
.rowlist>button:last-child{border-bottom:0}
.rowlist .grow{flex:1;min-width:0}
.rowlist b{display:block;font-size:.9375rem}
.rowlist small{display:block;color:var(--on-dark-muted);font-size:.8125rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowlist .side{display:flex;flex-direction:column;align-items:center;flex:none;margin-right:.6rem}
.rowlist time,.rowlist .end{font-size:.75rem;color:var(--on-dark-muted);flex:none}
.rowlist .end{margin:0 .5rem}
.rowlist .ic.lead{color:var(--gold);margin-left:.75rem}
.rowlist .avatar{width:2.875rem;height:2.875rem;font-size:1.125rem}
.dot{min-width:1.25rem;height:1.25rem;padding:0 .35rem;margin-top:.25rem;border-radius:.625rem;background:var(--gold);color:#2a190e;font-size:.75rem;font-weight:800;display:flex;align-items:center;justify-content:center}
.thread{display:flex;flex-direction:column;padding:.4rem var(--pad) 1rem}
.msg{max-width:78%;padding:.55rem .875rem;border-radius:18px;font-size:.9375rem;margin-top:.5rem}
.msg.them{align-self:flex-end;background:rgba(246,226,190,.16);border-bottom-left-radius:6px}
.msg.me{align-self:flex-start;background:#e6bd74;background:linear-gradient(180deg,#f6dca6,#d6a557);color:#2a190e;border-bottom-right-radius:6px}
.about-ad{margin:0 var(--pad) .6rem;padding:.6rem .875rem;border-radius:14px;background:rgba(31,18,10,.5);border:1px solid var(--line-dark);font-size:.875rem;color:var(--on-dark-muted)}
.about-ad b{color:var(--on-dark)}
.foot-thread-wrap{background:rgba(31,18,10,.82)}
.composer{display:flex;padding:.6rem var(--pad) .875rem}
.composer input{flex:1;min-width:0;height:3rem;border-radius:999px;border:1px solid var(--line-dark);background:rgba(246,226,190,.1);padding:0 1rem;outline:0}
.composer input:focus{border-color:var(--gold)}
.composer button{width:3rem;height:3rem;margin-right:.5rem;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#2a190e;background:#d6a557;background:linear-gradient(180deg,#f6dca6,#d6a557)}
.composer .ic{-webkit-transform:scaleX(-1);transform:scaleX(-1)}

/* ---------- account ---------- */
.me{display:flex;align-items:center;margin:.4rem var(--pad) 0;padding:1.1rem;border-radius:22px;color:var(--on-light);background:#ecd6ae;background:linear-gradient(160deg,#fbf1df,#e3c595)}
.me .avatar{width:3.75rem;height:3.75rem;font-size:1.5rem;background:#4d311c;background:linear-gradient(160deg,#6a3d18,#3a220f);color:var(--gold)}
.me b{font-size:1.125rem} .me small{display:block;color:var(--on-light-muted);font-size:.8125rem}
.stats{display:flex;margin:.75rem var(--pad) 1rem}
.stats div{flex:1;padding:.75rem .4rem;text-align:center;border-radius:16px;background:rgba(31,18,10,.5);border:1px solid var(--line-dark)}
.stats div + div{margin-right:.6rem}
.stats b{display:block;font-size:1.375rem;font-weight:800;color:var(--gold);line-height:1.2}
.stats span{font-size:.8125rem;color:var(--on-dark-muted)}

/* ---------- navigation: شريط سفلي في الهواتف ---------- */
.nav{position:relative;order:2;display:flex;align-items:flex-end;padding:.5rem .4rem .6rem;
  background:rgba(34,20,11,.94);border-top:1px solid var(--line-dark)}
.nav-brand{display:none}
.nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;font-size:.75rem;color:var(--on-dark-muted);padding:.25rem 0}
.nav button .ic{margin-bottom:.2rem}
.nav button[aria-current="page"]{color:var(--gold);font-weight:700}
.nav .orb{width:3.5rem;height:3.5rem;margin-top:-1.9rem;margin-bottom:.2rem;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#2a190e;
  background:#d6a557;background:linear-gradient(180deg,#f6dca6 0%,#d6a557 55%,#a8742f 100%);border:4px solid #2c1a0e;box-shadow:0 6px 16px rgba(0,0,0,.45)}
.nav .orb .ic{width:1.75rem;height:1.75rem;stroke-width:2.2;margin:0}
.nav .add{color:var(--on-dark)}
.app[data-s="splash"] .nav,.app[data-s="add"] .nav,.app[data-s="detail"] .nav,.app[data-s="thread"] .nav,.app[data-s="login"] .nav{display:none}

.toast{position:absolute;right:1.25rem;left:1.25rem;bottom:6rem;z-index:20;max-width:24rem;margin:0 auto;padding:.75rem 1rem;border-radius:14px;text-align:center;font-size:.875rem;
  background:var(--cream);color:var(--on-light);box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;-webkit-transform:translateY(8px);transform:translateY(8px);pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;-webkit-transform:none;transform:none}
.bottom-space{height:1.4rem}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

/* ---------- إضافات: فلترة، إعلاناتي، بائع، دخول ---------- */
.btn-light{color:var(--on-light);border:1px solid rgba(74,46,27,.3);background:#fffaf0}
.pill.icon{flex:none;width:2.75rem;padding:0;justify-content:center;position:relative;color:var(--on-dark)}
.pill.icon .ic{margin:0}
.pill.icon.on{border-color:var(--gold)}
.pill.icon .dot{position:absolute;top:-.35rem;left:-.25rem;margin:0}
.fpanel{margin-top:.75rem;max-width:34rem}
.frow{display:flex}
.frow .field{flex:1;min-width:0}
.frow .field + .field{margin-right:.6rem}
.fbtns{margin-top:1rem}
.fbtns .btn{min-height:3rem;font-size:1rem}
.fbtns .btn + .btn{margin-right:.6rem}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-gap:0 .6rem;gap:0 .6rem}
.badge.sold{background:#4d3a2a;color:#f7ead3}
.chip-s{display:inline-block;padding:.05rem .6rem;margin-bottom:.25rem;border-radius:999px;font-size:.75rem;font-weight:700;background:#dfe5c8;color:#3d4a1c}
.chip-s.off{background:#e0cdb4;color:#6b5540}
.list.one{grid-template-columns:minmax(0,1fr)}
.card.mine{cursor:default}
.mine-top{display:flex;cursor:pointer}
.mine-top .ph{flex:0 0 32%;max-width:8rem}
.mine-top .photo{height:100%;min-height:6.25rem;padding-top:0}
.mine-top h3{min-height:0}
.mine-acts{display:flex;border-top:1px solid var(--line-light)}
.mine-acts button{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;padding:.65rem .2rem;font-size:.875rem;font-weight:700;color:var(--umber)}
.mine-acts button + button{border-right:1px solid var(--line-light)}
.mine-acts .ic{width:1rem;height:1rem;margin-left:.3rem}
.mine-acts .danger{color:#9b2c14}
.rowlist>button.new{background:rgba(230,189,116,.12)}
.rowlist .dot{font-weight:700}
button.seller{width:100%;text-align:right}
.seller .grow{flex:1;min-width:0;display:block}
.seller>.ic{color:var(--on-dark-muted)}
.stars{display:inline-flex}
.stars .ic{width:1rem;height:1rem;color:var(--gold)}
.stars .ic.on{fill:var(--gold)}
.stars .ic.off{opacity:.4}
.review p{margin:.35rem 0 .25rem}
.review small{color:var(--on-dark-muted);font-size:.8125rem}
.me.guest{flex-direction:column;align-items:stretch;text-align:center}
.me.guest .btn{margin-top:.9rem}
.empty .btn{margin-top:1rem}
.otp{text-align:center;letter-spacing:.6em;font-weight:700}

.seg{display:flex;padding:3px;margin-bottom:.25rem;border-radius:999px;background:rgba(74,46,27,.12)}
.seg button{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;padding:.5rem .25rem;border-radius:999px;font-size:.875rem;font-weight:700;color:var(--on-light-muted)}
.seg button .ic{width:1.1rem;height:1.1rem;margin-left:.35rem}
.seg button[aria-pressed="true"]{background:#fffaf0;color:var(--on-light);box-shadow:0 1px 4px rgba(74,46,27,.25)}
.or{display:flex;align-items:center;padding:0 var(--pad);color:var(--on-dark-muted);font-size:.875rem}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line-dark)}
.or span{margin:0 .75rem}
.social{padding:.9rem var(--pad) 0}
.social .btn{min-height:3.1rem;font-size:1rem}
.social .btn + .btn{margin-top:.6rem}
.social .ic{width:1.25rem;height:1.25rem;margin-left:.6rem}
.btn-google{background:#fff;color:#1f1f1f;border:1px solid #dadce0}
.btn-apple{background:#000;color:#fff;border:1px solid rgba(255,255,255,.25)}

.cat.more{background:rgba(246,226,190,.10);color:var(--on-dark);border:1px solid var(--line-dark);box-shadow:none}
.cat.more .ic{color:var(--gold)}
.chips.tight{padding-bottom:.25rem}
.field select:disabled{opacity:.55}
.cimg{flex:none;--i1:#4a2a12;--i2:#c08a3e;--i3:#f6e9cf}
.cimg .a{fill:#4a2a12;fill:var(--i1)}.cimg .b{fill:#c08a3e;fill:var(--i2)}.cimg .c{fill:#f6e9cf;fill:var(--i3)}
.cimg .sa{fill:none;stroke:#4a2a12;stroke:var(--i1);stroke-linecap:round;stroke-linejoin:round}
.cimg .sb{fill:none;stroke:#c08a3e;stroke:var(--i2);stroke-linecap:round;stroke-linejoin:round}
.cat .cimg{width:2.6rem;height:2.6rem;margin-bottom:.4rem}
.form .cat[aria-pressed="true"] .cimg{--i2:#8a5a25;--i3:#f6dca6}
.splash-cats .cimg,.cat-label .cimg{--i1:#f6e2be;--i2:#d9a655;--i3:#3a2414}
.splash-cats .cimg{width:2.1rem;height:2.1rem}
.cat-label .cimg{width:1.6rem;height:1.6rem}
.card-link{color:inherit;text-decoration:none}
.card-link:focus-visible{outline:2px solid var(--gold-deep);outline-offset:2px;border-radius:4px}
[tabindex="-1"]:focus{outline:none}
.linkbtn{display:block;margin:.5rem auto 0;padding:.6rem 1rem;min-height:42px;color:var(--on-dark-muted);font-size:.875rem;text-decoration:underline}
.noscript{margin:2rem 1rem;padding:1rem;border-radius:14px;background:#f8eedc;color:#2a190e;text-align:center;font-family:system-ui,Tahoma,sans-serif}
.ltr-in{text-align:right}
.logo b,.nav-brand b{white-space:nowrap}
@media (max-width:359px){.home-head .loc-chip{display:none}}
.lang-picker{position:fixed;top:max(.75rem,env(safe-area-inset-top));left:max(.75rem,env(safe-area-inset-left));z-index:30;display:flex;align-items:center;gap:.4rem;min-height:42px;padding:0 .65rem;border:1px solid rgba(240,214,168,.35);border-radius:12px;background:rgba(40,24,12,.94);color:var(--on-dark);box-shadow:0 4px 14px rgba(0,0,0,.2)}
.lang-picker .ic{width:1.1rem;height:1.1rem;flex:none;color:var(--gold)}
.lang-picker select{min-height:40px;max-width:112px;padding:0 .1rem;border:0;outline:0;background:transparent;color:inherit;font:inherit;font-size:.8125rem;font-weight:700;cursor:pointer}
.lang-picker option{background:#2a190e;color:#fff}
.head-tools{display:inline-flex;align-items:center}
/* نص المستخدم: كسر الكلمات الطويلة، وحفظ الأسطر، واتجاه تلقائي */
.sheet h1,.block p,.msg,.card h3,.specs dd,.summary dd,.rowlist b,.about-ad,.me b,.seller b{overflow-wrap:anywhere;word-break:break-word;min-width:0}
.block p,.msg{white-space:pre-line}
.search:focus-within,.pill:focus-within{outline:2px solid var(--gold);outline-offset:2px}
.rowlist>button.danger b{color:#ffb39a}
.gallery .track:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
/* مساحات لمس لا تقل عن 40 بكسل */
.chip{display:inline-flex;align-items:center;min-height:40px}
.seg button{min-height:40px}
.fav{width:40px;height:40px}
.sec-head{align-items:center}
.sec-head button{min-height:40px;padding:0 .25rem}
.hero-cta{min-height:40px}
.sp-login{min-height:40px}
.pill select{align-self:stretch;height:auto}
.thumbs .rm{width:2.25rem;height:2.25rem}

/* ---------- أعمدة المنتجات تزيد حسب العرض ---------- */
@media (min-width:600px){
  .grid2{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cats{grid-template-columns:repeat(6,1fr)}
  .form .cats{grid-template-columns:repeat(4,1fr)}
  .thumbs{grid-template-columns:repeat(5,1fr)}
}
@media (min-width:720px){ .list{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (min-width:768px){
  :root{--pad:1.5rem}
  .hero{height:13rem} .hero-text h2{font-size:2.25rem} .hero-text p{font-size:1.0625rem}
  .hscroll{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-gap:.9rem;gap:.9rem;overflow:visible;padding-bottom:0;scroll-snap-type:none}
  .page-home .hscroll{clip-path:none}
  .hscroll::after{display:none}
  .hscroll .card + .card{margin-right:0}
  .grid2{grid-gap:.9rem;gap:.9rem}
  .search{max-width:40rem;margin-left:auto;margin-right:auto}
  .page-list .search{margin-right:var(--pad)}
  .filters{max-width:34rem}
}
@media (min-width:960px){
  .grid2,.hscroll{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media (min-width:960px), (min-width:600px) and (orientation:landscape){
  .detail-cols{display:flex;align-items:flex-start;padding:0 var(--pad)}
  .detail-cols .d-media{flex:0 0 52%;max-width:52%;margin-left:1.5rem}
  .detail-cols .gallery{border-radius:22px;border:1px solid var(--line-dark)}
  .detail-cols .d-info{flex:1;min-width:0}
  .detail-cols .sheet{padding:0 0 .5rem}
  .detail-cols .block{margin-right:0;margin-left:0}
  .page-detail{padding-top:1.25rem}
}
@media (min-width:1240px){
  .grid2,.hscroll{grid-template-columns:repeat(5,minmax(0,1fr))}
  .list{grid-template-columns:repeat(3,minmax(0,1fr))}
}

/* ---------- الأجهزة اللوحية والحاسوب والهاتف الأفقي: شريط تنقل جانبي على اليمين ---------- */
@media (min-width:768px), (min-width:540px) and (orientation:landscape){
  .app{flex-direction:row}
  .nav,.app[data-s="add"] .nav,.app[data-s="detail"] .nav,.app[data-s="thread"] .nav,.app[data-s="login"] .nav{
    order:0;display:flex;flex-direction:column;align-items:stretch;flex:0 0 5.75rem;width:5.75rem;padding:.75rem .5rem;overflow-y:auto;
    border-top:0;border-left:1px solid var(--line-dark);background:rgba(26,15,8,.78);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .app[data-s="splash"] .nav{display:none}
  .nav button{flex:none;padding:.6rem 0;margin-bottom:.25rem;border-radius:14px}
  .nav button[aria-current="page"]{background:rgba(230,189,116,.14)}
  .nav .orb{margin-top:0;width:2.75rem;height:2.75rem;border:0}
  .nav .orb .ic{width:1.5rem;height:1.5rem}
  .toast{bottom:1.5rem}
}
@media (min-width:768px) and (min-height:520px){
  .nav-brand{display:flex;justify-content:center;color:var(--gold);padding:.4rem 0 1rem}
  .nav-brand svg{width:2.9rem;height:2.5rem}
  .nav-brand div{display:none}
}
@media (min-width:1100px) and (min-height:520px){
  .nav,.app[data-s="add"] .nav,.app[data-s="detail"] .nav,.app[data-s="thread"] .nav,.app[data-s="login"] .nav{flex-basis:15rem;width:15rem;padding:1.25rem 1rem}
  .nav-brand{justify-content:flex-start;align-items:center;padding:.25rem .5rem 1.5rem}
  .nav-brand div{display:block;margin-right:.7rem}
  .nav-brand b{display:block;font-size:1.4rem;font-weight:800;line-height:1.15;color:var(--on-dark)}
  .nav button{flex-direction:row;font-size:1rem;padding:.75rem .9rem}
  .nav button .ic{margin:0 0 0 .75rem}
  .nav .add{margin:.5rem 0 .75rem;justify-content:center;color:#2a190e;font-weight:700;border-radius:999px;

   - النتيجة دائمًا { ok:true, data } أو { ok:false, error:{ code, message } }.

/* ---------- القراءة عبر طبقة API ----------
   المحوّل المحلي يوفّر قراءة فورية (DATA.now) فتبقى الواجهة كما هي بلا مرحلة تحميل.
   محوّل غير فوري (خادم لاحقًا) يمر بمسار التحميل والخطأ: تُحفظ النتيجة في RQ وتُعاد القراءة
   فقط عند تغيّر رقم المراجعة DATA.rev، ويُعاد الرسم عند وصولها. */
let DATA=API;
const RQ=new Map();
function readData(fn,args,key){
  if(DATA.now&&DATA.now[fn]){ const r=DATA.now[fn].apply(null,args); return r.ok?{st:'ok',data:r.data}:{st:'error',error:r.error}; }
  const k=fn+'|'+key, e=RQ.get(k), rev=DATA.rev;
  if(e&&(e.st==='loading'||e.rev===rev)) return e;
  const n={st:'loading',data:e?e.data:undefined,rev}; RQ.set(k,n);
  Promise.resolve().then(()=>DATA[fn].apply(null,args)).then(r=>{ RQ.set(k,r&&r.ok?{st:'ok',data:r.data,rev}:{st:'error',error:(r&&r.error)||{code:'unknown'},data:n.data,rev}); },
    ()=>{ RQ.set(k,{st:'error',error:{code:'network'},data:n.data,rev}); }).then(()=>render());
  return n;
}

const fCount=()=>{const f=S.f;return (f.min||f.max?1:0)+(f.y1||f.y2?1:0)+(f.cond?1:0)+(f.deal?1:0);};
function results(){
  const big=1e12, p=(a,d)=>a.price==null?d:a.price, f=S.f;
  let r=live().filter(a=>(S.cat==='rent'?a.deal==='للإيجار'&&(!S.sub||a.cat===S.sub):(!S.cat||a.cat===S.cat)&&(!S.sub||a.sub===S.sub))&&(!S.loc||a.loc===S.loc)&&(!S.q||matchQ(a,S.q))
    &&(!f.min||(a.price!=null&&a.price>=+f.min))&&(!f.max||(a.price!=null&&a.price<=+f.max))
    &&(!f.y1||(a.year&&a.year>=+f.y1))&&(!f.y2||(a.year&&a.year<=+f.y2))&&(!f.cond||a.cond===f.cond)&&(!f.deal||a.deal===f.deal)&&(!f.vtype||a.vtype===f.vtype)&&(!f.brand||a.brand===f.brand)&&(!f.model||a.model===f.model));
  if(S.sort==='new') r.sort((a,b)=>age(a)-age(b));
  if(S.sort==='low') r.sort((a,b)=>p(a,big)-p(b,big));
  if(S.sort==='high') r.sort((a,b)=>p(b,-1)-p(a,-1));
  return r;
}

function buildSpecs(w){

  if(NOPRICE.indexOf(w.cat)<0&&(w.price!==''||w.nego)) sp['السعر']=w.nego?'قابل للتفاوض':'نهائي'; return sp;
}
function validate(){
  const w=S.wiz;
  switch(w.step){
    case 0: if(w.rental&&!w.cat) return 'اختر نوع السلعة للتأجير.'; if(!w.cat) return 'اختر قسمًا للمتابعة.'; if(cat(w.cat).subs.length&&!w.sub) return 'اختر النوع داخل القسم حتى يظهر إعلانك في مكانه الصحيح.';
      if(w.cat==='cars'){ if(!w.specs['نوع المركبة']) return 'اختر نوع المركبة.'; if(!w.specs['الماركة']) return 'اختر ماركة السيارة.'; if(!w.specs['الموديل']) return 'اختر موديل السيارة، أو «أخرى» إن لم يكن في القائمة.'; } return '';
    case 1: return w.photos.length?'':'أضف صورة واحدة على الأقل.';
    case 2: return w.title.trim().length>=5?'':'اكتب عنوانًا من 5 أحرف على الأقل.';
    case 3: return w.desc.trim().length<15?'اكتب وصفًا من 15 حرفًا على الأقل.':'';
    case 4: w.price=lat(w.price).replace(/[,٬\s]/g,''); if(w.price==='') return ''; if(!/^\d{1,9}$/.test(w.price)) return 'اكتب السعر بالأرقام فقط، حتى 9 خانات.';

function fKey(el){ if(!el||!el.dataset||el===document.body) return null; if((el.tagName==='INPUT'&&el.type!=='checkbox')||el.tagName==='TEXTAREA') return null;
  let s=el.tagName.toLowerCase(), n=0; ['act','id','v','sub','in','spec','lin','change','owner','trim'].forEach(k=>{ if(el.dataset[k]!==undefined){ n++; s+=`[data-${k}="${String(el.dataset[k]).replace(/["\\]/g,'\\$&')}"]`; } });

/* تصغير الصورة قبل الحفظ؛ عند تعذّر التصغير لا تُحفظ إلا إن كانت صغيرة أصلًا */
function shrink(file,cb){
  const r=new FileReader();
  r.onload=()=>{const im=new Image();
    im.onload=()=>{let out; try{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',.75);}catch(e){ out=file.size<=400e3&&/^data:image\/(jpeg|png|webp|gif);base64,/.test(r.result)?r.result:null; } cb(out);};
    im.onerror=()=>cb(null); im.src=r.result;};
  r.onerror=()=>cb(null); r.readAsDataURL(file);
}

      if(!ph){ toast('في النسخة الفعلية يفتح واتساب مع البائع ومعه رسالة جاهزة عن الإعلان.'); break; }
      window.open('https://wa.me/966'+ph.slice(1)+'?text='+encodeURIComponent('السلام عليكم، بخصوص إعلانك في حراج العلا: '+a.title),'_blank','noopener'); break;}
    case 'msg': needLogin(()=>{let c=CHATS.find(x=>x.adId===S.adId); if(!c){const a=ad(S.adId);c={id:Date.now(),u:a.seller==='me',with:sellerInfo(a.seller,a.owner).name,adId:a.id,unread:0,time:'الآن',msgs:[]};CHATS.unshift(c);save();} S.chatId=c.id; go('thread');}); break;
    case 'chat': {const c=CHATS.find(x=>x.id===+id); if(!c) break; S.chatId=c.id; c.unread=0; save(); go('thread'); break;}
    case 'pick-rent':
      if(!w.rental){ if(RENT_CATS.indexOf(w.cat)<0){w.cat='';w.sub='';w.cond='used';w.specs={};w.trimOther=false;} w.rental=true; }
      w.deal='للإيجار'; w.err=''; render(); break;
    case 'pick-cat': if(w.cat!==id||w.rental){w.cat=id;w.rental=false;w.sub='';w.deal='';w.cond='used';w.specs={};w.trimOther=false;} w.err=''; render(); {const fl=$('.form .field'); if(fl){ try{fl.scrollIntoView({block:'center',behavior:'smooth'});}catch(x){fl.scrollIntoView();} }} break;
    case 'rm-photo': w.photos.splice(+id,1); render(); draftSave(true); break;
    case 'wiz-clear': wizPurge(); S.wiz=fresh(); render(); view.scrollTop=0; toast('مُسحت المسودة.'); break;
    case 'wiz-prev': if(isWiz(S.stack[S.stack.length-1])){ back(); break; }
      w.err=''; w.step--; if(w.step===4&&NOPRICE.indexOf(w.cat)>-1) w.step=3; render(); view.scrollTop=0; focusHead('.form h2'); break;
    case 'wiz-next': if(w.busy){ toast('جارٍ معالجة الصور، لحظة…'); break; } w.err=validate();
      if(!w.err&&w.step===7){ if(w.publishing) break; w.publishing=true;   /* منع النشر المكرر أثناء الحفظ */
        publish().then(okd=>{ w.publishing=false;
          if(!okd){ w.err='تعذّر حفظ الإعلان. حاول مرة أخرى.'; render(); focusInvalid(); return; }
          wizPurge(); w.step++; render(); view.scrollTop=0; focusHead('.form h2'); });
        break; }
      if(!w.err){ const from=w.step; S.stack.push({s:'add',wstep:from}); hPush();
        w.step++; if(w.step===4&&NOPRICE.indexOf(w.cat)>-1) w.step=5; }
      render(); if(!w.err){ view.scrollTop=0; focusHead('.form h2'); } else focusInvalid(); break;
  }
});
document.addEventListener('keydown',e=>{ const x=e.target; if(!x||!x.matches) return;
  if((e.key==='Enter'||e.key===' ')&&x.matches('[role="link"][data-act]')){ e.preventDefault(); x.click(); }
  else if(e.key==='Enter'&&!e.isComposing&&x.matches('.page-login input,.page-add input:not([type="file"]):not([type="checkbox"])')){ const b=$('.wiz-nav .btn-gold'); if(b){ e.preventDefault(); x.blur(); b.click(); } } });
document.addEventListener('input',e=>{
  const d=e.target.dataset; let v=e.target.type==='checkbox'?e.target.checked:e.target.value;
  if(typeof v==='string'&&d.num!==undefined){ const n=lat(v); if(n!==v){ e.target.value=n; v=n; } }
  if(d.in||d.spec||d.trim!==undefined) draftSave();
  if(d.in) S.wiz[d.in]=v;
  else if(d.trim!==undefined){ const w=S.wiz;   /* قائمة الفئة: «أخرى» تفتح خانة كتابة */
    if(v===OTHER){ w.trimOther=true; w.specs['الفئة']=''; } else { w.trimOther=false; if(v) w.specs['الفئة']=v; else delete w.specs['الفئة']; }
    render(); const x=$('input[data-spec="الفئة"]'); if(x) x.focus(); }
  else if(d.spec){ const sp=S.wiz.specs; sp[d.spec]=v;
    /* مركبات: نوع المركبة ← الماركة ← الموديل ← الفئة، وكل اختيار يمسح ما بعده */
    if(d.spec==='نوع المركبة'){ delete sp['الماركة']; delete sp['الموديل']; delete sp['الفئة']; S.wiz.trimOther=false; S.wiz.err='';
      const only=brandsOf(v).filter(x=>x!==OTHER); if(v&&only.length===1) sp['الماركة']=only[0];   /* نوع بماركة واحدة: تُختار تلقائيًا */
      render(); const s=$(sp['الماركة']?'[data-spec="الموديل"]':'[data-spec="الماركة"]'); if(s&&!s.disabled) s.focus(); }
    else if(d.spec==='الماركة'){ delete sp['الموديل']; delete sp['الفئة']; S.wiz.trimOther=false; S.wiz.err=''; render(); const s=$('[data-spec="الموديل"]'); if(s&&!s.disabled) s.focus(); }
    else if(d.spec==='الموديل'&&S.wiz.cat==='cars'){ const tl=carTrims(sp['الماركة'],v,sp['نوع المركبة']); S.wiz.trimOther=false; if(tl.length===1) sp['الفئة']=tl[0]; else delete sp['الفئة']; } }
  else if(d.lin) S.login[d.lin]=v;
});
document.addEventListener('change',e=>{
  if(e.target.id==='language-select'){ setLang(e.target.value); toast(LANG==='en'?'Language: English':LANG==='ur'?'زبان: اردو':'اللغة: العربية'); return; }
  if(e.target.dataset.lin&&e.target.tagName==='SELECT'){ S.login[e.target.dataset.lin]=e.target.value; return; }   /* قوائم الدخول: للمتصفحات التي لا تطلق input على select */
  const k=e.target.dataset.change; if(!k) return;
  if(k==='rent-cat'){
    const w=S.wiz, id=e.target.value;
    if(RENT_CATS.indexOf(id)<0){ w.cat=''; w.sub=''; w.deal='للإيجار'; w.specs={}; w.cond='used'; w.trimOther=false; }
    else if(w.cat!==id){ w.cat=id; w.sub=''; w.deal='للإيجار'; w.specs={}; w.cond='used'; w.trimOther=false; }
    w.err=''; render(); return;
  }
  if(k==='sort'||k==='loc'){ S[k]=e.target.value; render(); return; }
  if(k==='photos'){
    const w=S.wiz, all=[].slice.call(e.target.files), room=Math.max(0,10-w.photos.length-(w.pend||0));
    if(!all.length) return;
    const notImages=all.filter(f=>f.type.indexOf('image/')!==0).length;
    const tooLarge=all.filter(f=>f.type.indexOf('image/')===0&&f.size>25e6).length;
    const valid=all.filter(f=>f.type.indexOf('image/')===0&&f.size<=25e6), files=valid.slice(0,room), overflow=valid.length-files.length;
    let failed=0, left=files.length; const res=new Array(files.length); w.pend=(w.pend||0)+files.length;
    if(left){ w.busy=true; if(S.screen==='add') render(); }
    const done=()=>{ w.busy=false; w.pend=Math.max(0,(w.pend||0)-files.length); res.forEach(o=>{ if(o) w.photos.push(o); else failed++; }); w.err=''; if(S.screen==='add') render(); if(S.wiz===w) draftSave(true);
      toast(`نتيجة الصور: أضيفت ${res.filter(Boolean).length}، ملفات غير صور ${notImages}، تجاوزت 25 MB ${tooLarge}، لم تتسع الخانات ${overflow}، تعذّر فتحها ${failed}`); };
    if(!left){ done(); return; }
    files.forEach((f,i)=>{ let fired=false; const cb=out=>{ if(fired) return; fired=true; res[i]=out; if(--left===0) done(); };
      try{ shrink(f,cb); }catch(x){ cb(null); } });   /* خطأ في قراءة ملف لا يُبقي المعالجة عالقة */   /* تُضاف بترتيب الاختيار لا ترتيب انتهاء المعالجة */
  }
});
document.addEventListener('submit',e=>{
  e.preventDefault(); const f=e.target.dataset.form, el=e.target.elements;
  if(f==='search'){ const q=lat(el.q.value).trim().slice(0,60); S.q=q; if(S.screen==='list') render(); else {S.cat=null;resetList();S.q=q;go('list');} }
  if(f==='filter'){ readFilter(e.target); S.fOpen=false; render(); }
  if(f==='send'){ const t=el.t.value.trim().slice(0,1000); if(!t) return; const c=CHATS.find(x=>x.id===S.chatId); if(!c) return; c.msgs.push({me:true,t:t}); c.time='الآن'; save(); render(); $('.composer input').focus(); }
});
